name: Publish Package to npm

# Publishes to the npm registry via Trusted Publishing (OIDC) when a
# version tag (e.g. v2.3.0) is pushed. No npm token is stored anywhere.
on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write  # Required for OIDC (Trusted Publishing)
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build bundle
        run: npm run build

      - name: Publish to npm
        run: npm publish

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" --title "dtrPicker ${{ github.ref_name }}" --generate-notes
