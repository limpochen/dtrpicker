<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>dtrPicker v3.0 — Date Range Picker Demo</title>
<link rel="stylesheet" href="css/demo.css">
<!-- TypeScript 类型声明: dtrpicker/dtrpicker.d.ts（与 dtrpicker.js 同目录） -->
</head>
<body>

<!-- ====== Header ====== -->
<div class="demo-header">
  <h1>📅 dtrPicker</h1>
  <p id="demo-subtitle">Designed by Limpo · Implemented by GitHub Copilot</p>
</div>

<!-- ====== Main ====== -->
<div class="demo-main">

  <!-- Picker Demo Area -->
  <div class="card demo-picker-area">
    <div class="card-title">
      <span class="card-title-text" data-i18n="demoPicker">Picker Demo</span>
      <span class="source-switch">
        <label for="source-select">代码来源</label>
        <select id="source-select" title="选择器代码来源">
          <option value="dev">开发代码</option>
          <option value="bundle">打包代码</option>
        </select>
      </span>
    </div>
    <div class="input-row">
      <label for="picker-trigger" data-i18n="dateRangeLabel">Date Range:</label>
      <div class="picker-wrapper">
        <input type="text" id="picker-trigger" class="dtrpicker-trigger"
               placeholder="Please select a date range" autocomplete="off">
        <button type="button" class="dtrpicker-clear-btn" id="picker-clear-btn"
                title="Clear selection">✕</button>
      </div>
    </div>
    <p class="demo-hint" data-i18n="demoHint">
      💡 Click to open calendar · Drag to browse months · Click start/end dates · Real-time JSON
    </p>
  </div>

  <!-- Bottom Grid (4 cards) -->
  <div class="demo-grid">

  <!-- Configuration Panel -->
  <div class="card params-area">
    <div class="card-title" data-i18n="paramConfig">Configuration</div>
    <div class="param-group">
      <div class="param-row">
        <label data-i18n="colorSchemeLabel">Color Scheme</label>
        <select id="param-colorScheme" title="Color scheme">
          <option value="morandi" data-i18n="schemeMorandi">Morandi</option>
          <option value="nature" data-i18n="schemeNature">Nature</option>
        </select>
      </div>
      <div class="param-row">
        <label data-i18n="renderModeLabel">Render Mode</label>
        <select id="param-renderMode" title="Render mode">
          <option value="svg" data-i18n="renderModeSvg" selected>SVG</option>
          <option value="html" data-i18n="renderModeHtml">HTML+CSS</option>
        </select>
      </div>
      <div class="param-row">
        <label data-i18n="yearMonthModeLabel">Year/Month Display</label>
        <select id="param-yearMonthMode" title="Year/Month display mode">
          <option value="watermark" data-i18n="yearMonthWatermark" selected>Watermark</option>
          <option value="column" data-i18n="yearMonthColumn">Column</option>
        </select>
      </div>
      <div class="param-row">
        <label data-i18n="firstDayLabel">Week starts on</label>
        <label class="radio-label" data-i18n="sun"><input type="radio" name="param-firstDay" value="0"> Sun</label>
        <label class="radio-label" data-i18n="mon"><input type="radio" name="param-firstDay" value="1" checked> Mon</label>
      </div>
      <div class="param-row">
        <label data-i18n="modeLabel">Selection Mode</label>
        <select id="param-mode" title="Selection mode">
          <option value="date" data-i18n="modeDate">Date</option>
          <option value="dateTime" data-i18n="modeDateTime" selected>Date+Time</option>
          <option value="dateRange" data-i18n="modeDateRange">Date Range</option>
          <option value="dateTimeRange" data-i18n="modeDateTimeRange">Date Time Range</option>
        </select>
      </div>
      <div class="param-row">
        <label data-i18n="localeLabel">Language</label>
        <select id="lang-select" title="Language">
          <option value="zh-CN">简体中文</option>
          <option value="en-US">English</option>
          <option value="zh-TW">繁體中文</option>
          <option value="ja-JP">日本語</option>
          <option value="ko-KR">한국어</option>
          <option value="ru-RU">Русский</option>
          <option value="fr-FR">Français</option>
          <option value="de-DE">Deutsch</option>
          <option value="es-ES">Español</option>
          <option value="pt-BR">Português</option>
          <option value="it-IT">Italiano</option>
          <option value="th-TH">ไทย</option>
          <option value="vi-VN">Tiếng Việt</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Params Text Display -->
  <div class="card params-text-area">
    <div class="card-title" data-i18n="currentParams">Current Params (JSON)</div>
    <pre id="params-display">{ }</pre>
  </div>

  <!-- Code Sample Display -->
  <div class="card code-area">
    <div class="card-title" data-i18n="codeSample">Code Sample</div>
    <pre id="code-display"></pre>
  </div>

  <!-- Return Value JSON -->
  <div class="card json-area">
    <div class="card-title" data-i18n="returnValue">Return Value (JSON)</div>
    <pre id="json-display"><span class="json-null">null</span></pre>
  </div>

  </div><!-- /demo-grid -->

</div>

<!-- ====== ES Module fallback detection ====== -->
<script>
window.__esModuleLoaded = false;
setTimeout(function() {
  if (window.__esModuleLoaded) return;
  const msg = document.createElement('div');
  msg.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;padding:16px 24px;background:#fff2f0;border-bottom:2px solid #ff4d4f;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:14px;color:#cf1322;line-height:1.6';
  msg.innerHTML = '<strong>⚠️ Demo page failed to load</strong><br>'
    + 'Your browser blocks loading ES Module scripts under the <code>file://</code> protocol.<br>';
  document.body.prepend(msg);
}, 3000);
</script>

<!-- ====== Script (ES Module) ====== -->
<script type="module" src="js/demo.js?v=3.0.0"></script>

</body>
</html>
